          <h1 id="docker"><a href="#docker" class="headerlink" title="docker"></a>docker</h1><figure class="highlight c"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br><span class="line">18</span><br><span class="line">19</span><br><span class="line">20</span><br><span class="line">21</span><br><span class="line">22</span><br></pre></td><td class="code"><pre><span class="line">docker images</span><br><span class="line">查看有哪些镜像</span><br><span class="line"></span><br><span class="line">docker exec -it $hash bash</span><br><span class="line">进入一个正在运行的容器,并打开bash脚本</span><br><span class="line"></span><br><span class="line">docker ps</span><br><span class="line">查看docker目前运行着哪些镜像</span><br><span class="line"></span><br><span class="line">docker images</span><br><span class="line">列出来当前有哪些镜像</span><br><span class="line"></span><br><span class="line">docker cp aaa:/var/cache/</span><br><span class="line"></span><br><span class="line">docker run --rm -it --entrypoint /bin/sh can_you_find_it:latest</span><br><span class="line">覆盖原有的入口</span><br><span class="line"></span><br><span class="line">docker load -i D:\SucksFluorine\download\tmp\can_you_find_it.tar</span><br><span class="line">把压缩包以镜像模式加载到docker</span><br><span class="line"></span><br><span class="line">Ctrl+D</span><br><span class="line">退出一个正在运行的镜像,但是不会关掉这个环境</span><br></pre></td></tr></table></figure>
<p>docker镜像的架构:<br><figure class="highlight plaintext"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br></pre></td><td class="code"><pre><span class="line">/                             # 一个tar包</span><br><span class="line">├── blobs/                    # 存储所有内容寻址的数据块</span><br><span class="line">│   └── sha256/</span><br><span class="line">│       ├── &lt;hash1&gt;           # 镜像配置（JSON）</span><br><span class="line">│       ├── &lt;hash2&gt;           # 镜像层（压缩的 tar 包）</span><br><span class="line">│       ├── &lt;hash3&gt;           # manifest（清单）</span><br><span class="line">│       └── ...</span><br><span class="line">├── repositories              # 仓库信息（旧版兼容）</span><br><span class="line">├── oci-layout               # OCI 布局标识文件</span><br><span class="line">├── manifest.json            # 顶层清单（可能是索引）</span><br><span class="line">└── index.json               # OCI 索引文件</span><br></pre></td></tr></table></figure></p>
